name: Validate Walkie-Talkie
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check server.js
          node --check ws-lite.js
          node --check public/app.js
          node --check test/integration.test.js
      - name: Integration tests
        run: npm test
